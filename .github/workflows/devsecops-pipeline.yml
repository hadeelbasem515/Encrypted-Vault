name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v3

    - name: 2. File & Vault Structure Check
      run: |
        echo "Checking repository structure..."
        ls -la

    - name: 3. Security Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'table'
        severity: 'CRITICAL,HIGH'

    - name: 4. Generate SBOM with Syft
      uses: anchore/sbom-action@v0
      with:
        file: sbom.spdx.json

    - name: 5. Scan SBOM with Grype (Vulnerability Scanner)
      uses: anchore/scan-action@v3
      with:
        sbom: sbom.spdx.json
        fail-build: true
        severity: 'high'